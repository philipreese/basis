name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint backend (ruff)
        run: pixi run lint

      - name: Run backend tests (80% branch-coverage gate)
        run: pixi run test-backend

      - name: Check backend syntax
        run: pixi run check-backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check frontend types (svelte-check)
        run: npm run check
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E smoke pack (real stack, fresh DB)
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
