name: CI

on:
  pull_request:
  push:
    branches: [main]

# #847: explicit read-only token — fork PRs run attacker-controlled code, so
# the workflow must never assume more than it needs (the org default is
# read-only today; this makes it survive a default change).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # #847: third-party actions pinned to commit SHAs — a mutable tag is an
      # injection vector into CI. Tag kept as a comment for readability.
      - uses: prefix-dev/setup-pixi@2058dcd92f5dbe3befd7379ec6a3022bb746bdfd # v0.8.0
        with:
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint backend (ruff)
        run: pixi run lint

      - name: Run backend tests (80% branch-coverage gate)
        run: pixi run test-backend

      - name: Check backend syntax
        run: pixi run check-backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check frontend types (svelte-check)
        run: npm run check
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      # The browser download is the slowest step in the job, so it is cached
      # keyed on the locked Playwright version — it only re-downloads on a
      # dependency bump. The smoke pack runs headless-only, and headless mode
      # uses the chromium headless shell binary by default, so --only-shell
      # skips the full browser (~half the download) on a cache miss.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: frontend

      - name: Run E2E smoke pack (real stack, fresh DB)
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
