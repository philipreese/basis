[workspace]
name = "options-playbook-automation"
version = "0.35.0"
description = "Options Playbook Automation Engine & Research Runtime"
authors = ["Philip Reese <pbree@github.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = ">=3.11"
fastapi = ">=0.110"
uvicorn = ">=0.28"
sqlalchemy = ">=2.0"
aiosqlite = ">=0.20"
pydantic = ">=2.6"
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"
nodejs = ">=20.11"
python-dotenv = ">=1.0"
ruff = ">=0.16.3,<0.17"
pytest-cov = ">=7.1.0,<8"

[tasks]
install-node-deps = "npm install --prefix frontend"
sync-types = "npx openapi-typescript http://localhost:8000/openapi.json -o frontend/src/lib/api-types.ts"
server = { cmd = "uvicorn backend.main:app --reload --host localhost --port 8000", env = { PYTHONUNBUFFERED = "1" } }
client = { cmd = "npm run dev --prefix frontend", depends-on = ["install-node-deps"] }
dev = "pixi run server & pixi run client"
executor = "python -m backend.executor"
executor-nightly = "python -m backend.gateway_lifecycle"
flex-audit = "python -m backend.flex_audit"
test-backend = "python -m pytest backend/tests --cov=backend --cov-branch --cov-fail-under=80 -q"
test-frontend = "npm run test --prefix frontend"
e2e-backend = "python scripts/e2e_backend.py"
test-e2e = "npm run test:e2e --prefix frontend"
test = { cmd = "echo All tests passed.", depends-on = ["test-backend", "test-frontend"] }
lint = "ruff check backend && ruff format --check backend"
lint-fix = "ruff check --fix backend && ruff format backend"
check-frontend = "npm run check --prefix frontend"
check-backend = "python -m compileall backend/"
check = "pixi run check-backend && pixi run check-frontend"

[pypi-dependencies]
ib-async = ">=2.1.0, <3"
