[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basis-backend"
version = "0.82.1"
description = "basis — autonomous options trading lab (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "python-dotenv>=1.0"
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = [
    "B008",   # function call in default argument — FastAPI Depends() idiom
    "DTZ011", # date.today() — DTE math runs on the machine-local trading date by design
    "BLE001", # blind except — the documented graceful-degradation pattern (log + fall back)
    "S110",   # try/except/pass — same degradation pattern
    "E501",   # line length — formatter owns wrapping; long f-strings in messages allowed
]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["backend/tests/*", "backend/migrations/*"]
