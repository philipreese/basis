<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches the manifest background so the standalone splash and the
         browser chrome do not flash a different colour on launch. -->
    <meta name="theme-color" content="#12141a" />
    <!-- iOS ignores the manifest for these. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Chrome deprecated the apple-prefixed form; iOS still only reads
         that one, so both ship until iOS catches up (#1030). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="basis" />
    <title>basis</title>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 font-sans antialiased min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
